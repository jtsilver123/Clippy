name: Build

on:
  push:
  pull_request:

jobs:
  core-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test CookedCore
        run: swift test

  app-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build -c release
      - name: Test
        run: swift test
      - name: Bundle
        run: ./scripts/bundle.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Cooked.app
          path: build/Cooked.zip
